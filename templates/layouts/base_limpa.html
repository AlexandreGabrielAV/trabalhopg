<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}
        FilmBox - Organize seus filmes
        {% endblock %}
        </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href={{ url_for('static' , filename='imgs/icone.png') }}>
</head>
<body>

       
    <div class="container my-5 main-container d-flex align-items-center justify-content-center">
        {% for tipo, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ tipo }} alert-dismissible fade show" role="alert">
        {{ mensagem }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
      {% endfor %}
        {% block conteudo %}

        {% endblock %}
    </div>





        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        {% block scripts %}{% endblock %}
</body>
</html>
