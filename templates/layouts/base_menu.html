<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}
        FilmBox - Organize seus filmes
        {% endblock %}
        </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href={{ url_for('static' , filename='imgs/icone.png') }}>
</head>
<body>

    <!------------------------------------>
    <!--      BARRA DE NAVEGAÇÃO        -->
    <!------------------------------------>

    <nav class="navbar navbar-expand-lg navbar-dark bg-header px-4 py-3 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
                <i class="bi bi-film text-primary display-6"></i> FilmBox
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('dashboard') }}">Início</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="usuariosDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-people-fill me-1"></i> Usuários
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('listar_usuarios') }}">Listar Usuários</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('inserir_usuarios') }}">Novo Usuário</a></li>
                        </ul>
                    </li>



                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#" id="filmesDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-film"></i> Filmes
                        </a>
                        <ul class="dropdown-menu">
                             <li><a class="dropdown-item" href="{{ url_for('listar_filmes') }}">Listar Filmes</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('inserir_filmes') }}">Novo Filme</a></li>
                        </ul>
                    </li>


                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#" id="aluguelDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-film"></i> Aluguéis
                        </a>
                        <ul class="dropdown-menu">
                             <li><a class="dropdown-item" href="{{ url_for('listar_aluguel') }}">Listar Aluguéis</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('inserir_aluguel') }}">Novo Aluguel</a></li>
                        </ul>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center gap-2">
                    <a href="{{ url_for('inserir_usuarios') }}" class="btn btn-primary fw-semibold px-3">
                        <i class="bi bi-person-plus me-1"></i> Cadastre-se
                    </a>
                    <a href="{{ url_for('inicio') }}" class="btn btn-primary fw-semibold px-3">
                        <i class="bi bi-person-fill"></i> Login
                    </a>
                </div>
            </div>
        </div>
    </nav>


    <!------------------------------------>
    <!--      CATÁLOGO DE FILMES        -->
    <!------------------------------------>

    <main class="main-container container my-5">
    {% block conteudo %}
    {% endblock %}
</main>

    <!------------------------------------>
    <!--         RODAPÉ DO SITE         -->
    <!------------------------------------>

    <footer class="bg-header text-white-50 text-center py-3 mt-auto">
        <p class="mb-0 small">Site construido por <strong>FilmBox LTDA</strong></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
