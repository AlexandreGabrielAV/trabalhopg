<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Topbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-header px-4 py-3 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="bi bi-gear-fill text-primary"></i> Painel de Administração
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="usuariosDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-people-fill me-1"></i> Usuários
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('listagem') }}">Listar Usuários</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('cadastro') }}">Novo Usuário</a></li>
                        </ul>
                    </li>
                </ul>
                
                <form class="d-flex align-items-center gap-2" role="search">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input class="form-control border-start-0" type="search" placeholder="Procurar usuário..." aria-label="Procurar">
                    </div>
                    <a href="{{ url_for('inicio') }}" class="btn btn-outline-light text-uppercase px-3 fw-semibold" type="button">
                        <i class="bi bi-box-arrow-right me-1"></i> Sair
                    </a>
                </form>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-5 main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark m-0"><i class="bi bi-person-plus-fill text-primary me-2"></i>Cadastro de Usuário</h3>
            <a href="{{ url_for('inicio') }}" class="btn btn-link text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Voltar para o inicio</a>
        </div>

        <div class="card-form">
            <form action="/cadastros" method="POST">
                
                <!-- SEÇÃO 1: DADOS PESSOAIS -->
                <div class="section-title">
                    <i class="bi bi-person-badge me-2 text-primary"></i>Dados Pessoais & Acesso
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome Completo" required>
                            <label for="nome"><i class="bi bi-person me-1"></i> Nome Completo</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
                            <label for="email"><i class="bi bi-envelope me-1"></i> Email</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="celular" name="celular" placeholder="(00) 00000-0000">
                            <label for="celular"><i class="bi bi-telephone me-1"></i> Celular</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" placeholder="Data de Nascimento">
                            <label for="data_nascimento"><i class="bi bi-calendar-event me-1"></i> Nascimento</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00">
                            <label for="cpf"><i class="bi bi-card-heading me-1"></i> CPF</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <select class="form-select" id="nivel_acesso" name="nivel_acesso">
                                <option value="" selected>Selecione...</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Usuario">Usuário</option>
                            </select>
                            <label for="nivel_acesso"><i class="bi bi-shield-lock me-1"></i> Nível de Acesso</label>
                        </div>
                    </div>
                </div>

                <!-- SEÇÃO 2: PREFERÊNCIAS -->
                <div class="section-title">
                    <i class="bi bi-sliders me-2 text-primary"></i>Preferências
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="categoria_filme" name="categoria_filme">
                                <option value="" selected>Selecione uma categoria...</option>
                                <option value="Ação">Ação</option>
                                <option value="Comédia">Comédia</option>
                                <option value="Drama">Drama</option>
                                <option value="Ficção Científica">Ficção Científica</option>
                                <option value="Romance">Romance</option>
                                <option value="Terror">Terror</option>
                            </select>
                            <label for="categoria_filme"><i class="bi bi-film me-1"></i> Categoria de Filme Favorito</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="idioma_principal" name="idioma_principal">
                                <option value="" selected>Selecione o idioma...</option>
                                <option value="Português">Português</option>
                                <option value="Inglês">Inglês</option>
                                <option value="Espanhol">Espanhol</option>
                            </select>
                            <label for="idioma_principal"><i class="bi bi-translate me-1"></i> Idioma Principal</label>
                        </div>
                    </div>
                </div>

                <!-- SEÇÃO 3: ENDEREÇO -->
                <div class="section-title">
                    <i class="bi bi-geo-alt me-2 text-primary"></i>Endereço
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-000">
                            <label for="cep">CEP</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Rua, Avenida...">
                            <label for="endereco">Endereço</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="numero" name="numero" placeholder="Número">
                            <label for="numero">Número</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="complemento" name="complemento" placeholder="Apt, Bloco...">
                            <label for="complemento">Complemento</label>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Cidade">
                            <label for="cidade">Cidade</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <select class="form-select" id="estado" name="estado">
                                <option value="" selected>Selecione...</option>
                                <option value="SP">São Paulo (SP)</option>
                                <option value="RJ">Rio de Janeiro (RJ)</option>
                                <option value="MG">Minas Gerais (MG)</option>
                            </select>
                            <label for="estado">Estado</label>
                        </div>
                    </div>
                </div>

                <!-- Ações -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <button type="reset" class="btn btn-clear">
                        <i class="bi bi-eraser me-1"></i> Limpar
                    </button>
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-lg me-1"></i> Salvar Cadastro
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="bg-header text-white-50 text-center py-3 mt-auto">
        <p class="mb-0 small">Site contruido por <strong>FilmBox LTDA</strong></p>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
