{% extends 'index.html'%}


{% block content %}
    <!------------------------------------>
    <!--      CONTEÚDO PRINCIPAL        -->
    <!------------------------------------>

    <div class="container my-5 main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark m-0"><i class="bi bi-person-plus-fill text-primary me-2"></i>Cadastro de Usuário</h3>
            <a href="{{ url_for('inicio') }}" class="btn btn-link text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Voltar para o inicio</a>
        </div>

        <div class="card-form">
            <form action="/cadastros" method="POST">
                

                <!------------------------------------>
                <!--        DADOS PESSOAIS          -->
                <!------------------------------------>

                <div class="section-title">
                    <i class="bi bi-person-badge me-2 text-primary"></i>Dados Pessoais & Acesso
                </div>


                <!------------------------------------>
                <!--        NOME COMPLETO           -->
                <!------------------------------------>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome Completo" required>
                            <label for="nome"><i class="bi bi-person me-1"></i> Nome Completo</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--            EMAIL               -->
                <!------------------------------------>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
                            <label for="email"><i class="bi bi-envelope me-1"></i> Email</label>
                        </div>
                    </div>

                
                <!------------------------------------>
                <!--             CELULAR            -->
                <!------------------------------------>

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="celular" name="celular" placeholder="(00) 00000-0000">
                            <label for="celular"><i class="bi bi-telephone me-1"></i> Celular</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--           NASCIMENTO           -->
                <!------------------------------------>

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" placeholder="Data de Nascimento">
                            <label for="data_nascimento"><i class="bi bi-calendar-event me-1"></i> Nascimento</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--              CPF               -->
                <!------------------------------------>

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00">
                            <label for="cpf"><i class="bi bi-card-heading me-1"></i> CPF</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--        NÍVEL DE ACESSO         -->
                <!------------------------------------>

                    <div class="col-md-3">
                        <div class="form-floating">
                            <select class="form-select" id="nivel_acesso" name="nivel_acesso">
                                <option value="" selected>Selecione...</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Usuario">Usuário</option>
                            </select>
                            <label for="nivel_acesso"><i class="bi bi-shield-lock me-1"></i> Nível de Acesso</label>
                        </div>
                    </div>
                </div>




                <!------------------------------------>
                <!--          PREFERÊNCIAS          -->
                <!------------------------------------>

                <div class="section-title">
                    <i class="bi bi-sliders me-2 text-primary"></i>Preferências
                </div>
                
            
                <!------------------------------------>
                <!--           ENDEREÇO             -->
                <!------------------------------------>

                <div class="section-title">
                    <i class="bi bi-geo-alt me-2 text-primary"></i>Endereço
                </div>


                <!------------------------------------>
                <!--              CEP               -->
                <!------------------------------------>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-000">
                            <label for="cep">CEP</label>
                        </div>
                    </div>

                
                <!------------------------------------>
                <!--              RUA               -->
                <!------------------------------------>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Rua, Avenida...">
                            <label for="endereco">Endereço</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--             NÚMERO             -->
                <!------------------------------------>

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="numero" name="numero" placeholder="Número">
                            <label for="numero">Número</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--         COMPLEMENTO            -->
                <!------------------------------------>

                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="complemento" name="complemento" placeholder="Apt, Bloco...">
                            <label for="complemento">Complemento</label>
                        </div>
                    </div>

                
                <!------------------------------------>
                <!--              CIDADE            -->
                <!------------------------------------>

                    <div class="col-md-5">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Cidade">
                            <label for="cidade">Cidade</label>
                        </div>
                    </div>


                <!------------------------------------>
                <!--            ESTADO              -->
                <!------------------------------------>

                    <div class="col-md-3">
                        <div class="form-floating">
                            <select class="form-select" id="estado" name="estado">
                                <option value="" selected>Selecione...</option>
                                <option value="SP">São Paulo (SP)</option>
                                <option value="RJ">Rio de Janeiro (RJ)</option>
                                <option value="MG">Minas Gerais (MG)</option>
                            </select>
                            <label for="estado">Estado</label>
                        </div>
                    </div>
                </div>





                <!------------------------------------>
                <!--           BOTÕES               -->
                <!------------------------------------>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <button type="reset" class="btn btn-clear">
                        <i class="bi bi-eraser me-1"></i> Limpar
                    </button>
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-lg me-1"></i> Salvar Cadastro
                    </button>
                </div>

            </form>
        </div>
    </div>


{% endblock %}
