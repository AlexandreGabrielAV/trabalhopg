<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmBox - Entrar</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href={{ url_for('static' , filename='imgs/icone.png') }}>
</head>
<body>


    
    <!------------------------------------>
    <!--      BARRA DE NAVEGAÇÃO        -->
    <!------------------------------------>

    <nav class="navbar navbar-expand-lg navbar-dark bg-header px-4 py-3 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('inicio') }}">
                <i class="bi bi-film text-primary display-6"></i> FilmBox
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('inicio') }}">Início</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="{{ url_for('cadastro') }}" class="btn btn-outline-light fw-semibold px-3">
                        <i class="bi bi-person-plus me-1"></i> Criar Conta
                    </a>
                </div>
            </div>
        </div>
    </nav>



    <!------------------------------------>
    <!--      FORMULÁRIO DE LOGIN       -->
    <!------------------------------------> 

    <div class="container my-5 main-container d-flex align-items-center justify-content-center">
        <div class="card-form login-card w-100 shadow-lg">
            

            <!------------------------------------>
            <!--      CABEÇALHO DO CARD         -->
            <!------------------------------------>

            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                    <i class="bi bi-box-arrow-in-right fs-2"></i>
                </div>
                <h4 class="fw-bold text-dark m-0">Acessar FilmBox</h4>
                <p class="text-muted small">Entre com suas credenciais para acessar</p>
            </div>



            <!------------------------------------>
            <!--           FORMULÁRIO           -->
            <!------------------------------------>

            <form action="{{ url_for('login') }}" method="POST">
                

                <!------------------------------------>
                <!--             EMAIL              -->
                <!------------------------------------>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
                    <label for="email"><i class="bi bi-envelope me-1"></i> E-mail</label>
                </div>


                <!------------------------------------>
                <!--             SENHA              -->
                <!------------------------------------>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required>
                    <label for="senha"><i class="bi bi-lock me-1"></i> Senha</label>
                </div>


                <!------------------------------------>
                <!--        BOTÃO DE ENVIAR         -->
                <!------------------------------------>

                <button type="submit" class="btn btn-save w-100 py-3 text-uppercase fw-bold shadow-sm mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>


                <!------------------------------------>
                <!--   REDIRECIONAR PARA CADASTRO   -->
                <!------------------------------------>
                
                <div class="text-center mt-3">
                    <span class="text-muted small">Ainda não possui uma conta?</span>
                    <a href="{{ url_for('cadastro') }}" class="text-primary text-decoration-none fw-bold small ms-1">Cadastre-se</a>
                </div>

            </form>
        </div>
    </div>





    <!------------------------------------>
    <!--         RODAPÉ DO SITE         -->
    <!------------------------------------>

    <footer class="bg-header text-white-50 text-center py-3 mt-auto">
        <p class="mb-0 small">Site construido por <strong>FilmBox LTDA</strong></p>
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
