{% extends 'index.html'%}


{% block content %}
    <!------------------------------------>
    <!--      INFORMAÇÕES SUPERIOR      -->
    <!------------------------------------>

    <div class="container my-5 main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark m-0"><i class="bi bi-people-fill text-primary me-2"></i>Aluguéis no Sistema</h3>
            <a href="{{ url_for('aluguel') }}" class="btn btn-save">
                <i class="bi bi-plus-lg me-1"></i> Novo Aluguel
            </a>
        </div>



    <!------------------------------------>
    <!--      CABEÇALHO DA TABELA       -->
    <!------------------------------------>

        <div class="card-form p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome</th>
                            <th>Tempo</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>



                        <!------------------------------------>
                        <!-- 1° FILME FIXO CRIADO NO HTML   -->
                        <!------------------------------------>

                        <tr style="cursor: pointer;">
                            <td class="ps-4 fw-bold text-muted">1</td>
                            <td class="fw-semibold text-dark">Matrix</td>
                            <td>2 Semanas</td>
                            <td>R$ 20,00</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-warning rounded-2" title="Editar">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </button>

                                <button type="button" class="btn btn-sm btn-outline-danger rounded-2" title="Excluir">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </td>
                        </tr>



                        <!------------------------------------>
                        <!-- 2° FILME FIXO CRIADO NO HTML   -->
                        <!------------------------------------>

                        <tr style="cursor: pointer;">
                            <td class="ps-4 fw-bold text-muted">2</td>
                            <td class="fw-semibold text-dark">Batman: O Cavaleiro das Trevas</td>
                            <td>1 Semana</td>
                            <td>R$ 10,00</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-warning rounded-2" title="Editar">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </button>

                                <button type="button" class="btn btn-sm btn-outline-danger rounded-2" title="Excluir">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </td>
                        </tr>


                        <!------------------------------------>
                        <!-- 3° FILME FIXO CRIADO NO HTML   -->
                        <!------------------------------------>

                        <tr style="cursor: pointer;">
                            <td class="ps-4 fw-bold text-muted">3</td>
                            <td class="fw-semibold text-dark">Interestelar</td>
                            <td>2 Dias</td>
                            <td>R$ 2,00</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-warning rounded-2" title="Editar">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </button>

                                <button type="button" class="btn btn-sm btn-outline-danger rounded-2" title="Excluir">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </td>
                        </tr>


                        <!------------------------------------>
                        <!-- 4° FILME FIXO CRIADO NO HTML   -->
                        <!------------------------------------>

                        <tr style="cursor: pointer;">
                            <td class="ps-4 fw-bold text-muted">4</td>
                            <td class="fw-semibold text-dark">A Origem</td>
                            <td>1 Dia</td>
                            <td>R$ 1,00</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-warning rounded-2" title="Editar">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </button>

                                <button type="button" class="btn btn-sm btn-outline-danger rounded-2" title="Excluir">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </td>
                        </tr>
                    
                    </tbody>
                </table>
            </div>
        </div>
    </div>



    
{% endblock %}
